  - id: spa-08
    category: spatial
    difficulty: hard
    expected_behavior: answer
    question: "Dans quel carré de 1 km sur 1 km de Bordeaux y a-t-il eu le plus de ventes d'appartements en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Grid binning in EPSG:2154 (degrees are not metres). The answer should locate the cell (centre ~ Saint-Pierre / Saint-Michel, historic centre). No tie (300 vs 257)."
    sql: |
      -- 1 km cells in Lambert-93; a cell = its south-west corner (metres) + its centre in WGS84.
      SELECT x_l93, y_l93, nb_ventes,
             round(ST_X(c)::numeric, 4) AS centre_longitude, round(ST_Y(c)::numeric, 4) AS centre_latitude
      FROM (
          SELECT (floor(ST_X(geom) / 1000) * 1000)::int AS x_l93,
                 (floor(ST_Y(geom) / 1000) * 1000)::int AS y_l93,
                 count(*) AS nb_ventes
          FROM dvf.ventes
          WHERE code_commune = '33063' AND annee = 2024 AND est_vente AND type_bien = 'Appartement'
            AND geom IS NOT NULL
          GROUP BY 1, 2
          ORDER BY nb_ventes DESC
          LIMIT 1
      ) t,
      LATERAL (SELECT ST_Transform(ST_SetSRID(ST_MakePoint(x_l93 + 500, y_l93 + 500), 2154), 4326) AS c) p;

