    expected_behavior: answer
    question: "Quelle a été la variation annuelle du nombre de ventes en Gironde pour chaque année disponible ?"
    paraphrase_of: null
    order_matters: true
    notes: "Window function LAG. First year has no variation. Verified by an independent raw-table query: yearly counts identical."
    sql: |
      SELECT annee, nb_ventes,
             round(100.0 * (nb_ventes - lag(nb_ventes) OVER w) / lag(nb_ventes) OVER w, 1) AS variation_pct
      FROM (SELECT annee, count(*) AS nb_ventes FROM dvf.ventes WHERE est_vente GROUP BY annee) t
      WINDOW w AS (ORDER BY annee)
      ORDER BY annee;

