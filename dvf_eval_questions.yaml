# DVF text-to-SQL evaluation set
#
# Fields
#   id               stable identifier, never reuse
#   category         simple | aggregation | temporal | ranking | spatial | multi_step |
#                    data_quality | paraphrase | ambiguous | unanswerable | security | privacy
#   difficulty       easy | medium | hard  (your estimate; revise after the baseline run)
#   expected_behavior
#                    answer        -> the system must return the same result as `sql`
#                    clarify       -> the system must ask a question (v1.6: answering with stated
#                                     assumptions is reported, never passed)
#                    unanswerable  -> the system must say the data cannot answer
#                    refuse        -> the system must refuse; nothing may execute
#   paraphrase_of    id of the reference question (same expected result), or null
#   order_matters    compare results as ordered lists (true) or as unordered sets (false)
#   notes            traps and conventions to keep in mind when writing the SQL
#   sql              gold query: fill in for `answer` items, leave null otherwise
#
# Conventions (the semantic layer, sql/semantic.sql in dvf-airflow-pipeline):
#   - Scope: Gironde (code_departement '33'), DVF géolocalisées (Etalab), years 2021-2025.
#   - Query only dvf.ventes (1 row per mutation), dvf.biens (1 row per deduplicated
#     property), dvf.lieux (landmarks), dvf.zones (groups of communes), dvf.communes
#     (one official name per INSEE code; look codes up there, never guess them).
#   - "vente" = 1 mutation; est_vente = Vente, VEFA, Vente terrain à bâtir, Adjudication
#     (Echange and Expropriation are mutations, not sales). "transactions" = ventes.
#   - "N maisons/appartements vendus" counts properties (dvf.biens); "ventes de maisons"
#     counts sales whose type_bien is Maison (house + optional dépendances).
#   - DVF repeats a local once per nature de culture of its parcel: dvf.biens keeps one
#     row per real local (Gironde 2024: 14 371 raw Maison rows for 12 388 houses).
#   - A mutation spanning several communes counts once, in its main property's commune
#     (so commune counts add up to the department total). Same for code_postal.
#   - "prix" without qualifier = median. v1.7: a "prix moyen" (price or price per m²)
#     is the median too, robust to exceptional sales; the mean may be returned next to
#     it. Other averages stay means (AVG): pièces, surfaces, and dq-01's "valeur
#     moyenne d'une vente" (a data-quality test of the per-mutation average).
#   - Price statistics use vente_reference: exactly
#     one house or apartment (dépendances allowed, no commercial premises), nature Vente
#     or VEFA, valeur_fonciere > 0. prix_m2 = valeur_fonciere / surface_reelle_bati.
#   - Descriptive property statistics (surface, pièces) use dvf.biens; when counts and
#     prices are combined, both come from the vente_reference sample.
#   - T<n> = apartment with n pièces principales. "Plus de" = strictly greater.
#   - Rankings: minimum 20 sales in the statistic's sample; default top-N = 10;
#     ties are kept (rank() <= N) when they cross the cut-off.
#   - No year given = all years 2021-2025. "Depuis YYYY" includes YYYY. "Dernières
#     années" = last complete years in the data. Relative dates use eval_today.
#   - Percentages: one decimal. EUR/m2 rounded to the euro, except where rounding
#     would erase the value itself (agg-16: a 0.01 EUR/m2 symbolic price stays 0.01).
#   - Spatial: geom columns are Lambert-93 (EPSG:2154, metres). Distance-based counts
#     differ from geodesic ones by < 0.1%: score them with that tolerance.
#   - VEFA TRAP: ~95% of VEFA sales have no type_local and no surface
#     (type_bien = 'Lot non décrit'): never counted as apartments, no prix_m2.
#   - Home-search questions (v1.3): asked by future renters and buyers (families,
#     commuters, students, investors); each note starts with WHY they ask.
#     * Rents (dvf.loyers): predicted advertised rent EUR/m2 charges included, not a
#       median; default segment 'appartement', T1-T2 / studio -> appartement_1_2_pieces,
#       T3+ -> appartement_3_pieces_plus; default year = latest edition (2025); editions
#       NOT comparable over time; monthly rent of S m2 = loyer_m2 x S; rankings keep
#       fiable estimates only.
#     * Budget: surface = budget / median prix_m2 of the latest complete year (2025);
#       gross yield = 12 x loyer_m2 / median prix_m2 x 100; price-to-rent = prix_m2 /
#       (12 x loyer_m2).
#     * Commute (dvf.temps_trajet): typical door-to-destination minutes by public
#       transport, arrival 07:30-09:00 on a Tuesday; per commune = median over its
#       addresses. Destinations: Centre de Bordeaux, Gare Saint-Jean, Aéroport de
#       Mérignac, CHU Pellegrin, Campus Talence-Pessac.
#     * Schools on foot (dvf.acces_adresses): walking minutes on the street network;
#       "most addresses" = more than 50 %. IPS is a social profile, not a quality
#       score; collège results = IVAC (value added).
#     * Vacancy rate = vacants / parc_prive of the same LOVAC edition (2025 = latest with
#       a stock; method break in 2025). DPE: passoire = F or G; dwelling statistics
#       exclude type_batiment 'immeuble'; "DPE moyen" = median class. Long series: rates are fractions, answer in %.
#   - "Terrain à bâtir" is ambiguous (VAT nature_mutation vs cadastral culture AB).
#
# Spatial questions marked with `lieux` use dvf.lieux (Place de la Bourse, Gare
# Saint-Jean, Place des Quinconces, Aéroport Bordeaux-Mérignac, Plage centrale de
# Lacanau-Océan), WGS84 coordinates from OpenStreetMap / AIP, approximate.

dvf_release: "2026-04"  # DGFiP release of April 2026 (Etalab geo-dvf files Last-Modified 2026-05-18); 2025 complete
eval_today: "2026-10-15"
eval_version: "1.7"     # bump on ANY gold change (SQL, conventions, categories); tag eval-v<version>
questions:
  - id: sim-01
    category: simple
    difficulty: easy
    expected_behavior: answer
    question: "Combien de ventes ont été enregistrées en Gironde en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Count distinct mutations (id_mutation), not rows. Verified by an independent raw-table query (count(DISTINCT id_mutation) on dvf.mutations): 29 200."
    sql: |
      SELECT count(*) AS nb_ventes
      FROM dvf.ventes
      WHERE annee = 2024 AND est_vente;

  - id: sim-02
    category: simple
    difficulty: easy
    expected_behavior: answer
    question: "Combien d'appartements ont été vendus à Bordeaux en 2023 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Convention: 'N appartements vendus' counts PROPERTIES (dvf.biens), not sales; a building sold in one deed counts each apartment. VEFA TRAP: untyped VEFA lots ('Lot non décrit', ~500 sales/year in Bordeaux) are not counted; the answer should say so. Verified by an independent raw-table query (raw rows on the first culture of each parcel): 4 179."
    sql: |
      -- Convention: "N appartements vendus" counts properties (dvf.biens), not sales.
      SELECT count(*) AS nb_appartements
      FROM dvf.biens
      WHERE code_commune = '33063'  -- Bordeaux
        AND annee = 2023 AND est_vente AND type_local = 'Appartement';

  - id: sim-03
    category: simple
    difficulty: easy
    expected_behavior: answer
    question: "Combien de maisons ont été vendues à Mérignac en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "TRAP: raw rows count 347 because DVF repeats a house once per nature de culture of its parcel; deduplicated = 328. Verified by an independent raw-table query."
    sql: |
      SELECT count(*) AS nb_maisons
      FROM dvf.biens
      WHERE code_commune = '33281'  -- Mérignac
        AND annee = 2024 AND est_vente AND type_local = 'Maison';

  - id: sim-04
    category: simple
    difficulty: easy
    expected_behavior: answer
    question: "Combien de ventes en l'état futur d'achèvement (VEFA) ont eu lieu à Bordeaux en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "nature_mutation = 'Vente en l''état futur d''achèvement'; count mutations. Verified by an independent raw-table query: 604."
    sql: |
      SELECT count(*) AS nb_vefa
      FROM dvf.ventes
      WHERE code_commune = '33063' AND annee = 2024
        AND nature_mutation = 'Vente en l''état futur d''achèvement';

  - id: sim-05
    category: ambiguous
    difficulty: easy
    expected_behavior: clarify
    question: "Combien de terrains à bâtir ont été vendus en Gironde en 2023 ?"
    paraphrase_of: null
    notes: "'Terrain à bâtir' has two meanings in DVF: nature_mutation = 'Vente terrain à bâtir' (a VAT category: 65 sales in Gironde 2023) vs land-only sales including a parcel of nature_culture 'terrains a bâtir' (AB: 1 229 sales). Expected: ask, or state the definition used."
    sql: null

  - id: sim-06
    category: simple
    difficulty: easy
    expected_behavior: answer
    question: "Combien de ventes ont eu lieu à Lormont en 2025 ?"
    paraphrase_of: null
    order_matters: false
    notes: "2025 is COMPLETE in this release (DGFiP 2026-04, Jan-Dec 2025); the answer must not call it partial."
    sql: |
      SELECT count(*) AS nb_ventes
      FROM dvf.ventes
      WHERE code_commune = '33249'  -- Lormont
        AND annee = 2025 AND est_vente;

  - id: sim-07
    category: simple
    difficulty: easy
    expected_behavior: answer
    question: "Quelles sont les différentes natures de mutation présentes dans les données ?"
    paraphrase_of: null
    order_matters: false
    notes: ""
    sql: |
      SELECT DISTINCT nature_mutation
      FROM dvf.ventes;

  - id: sim-08
    category: simple
    difficulty: easy
    expected_behavior: answer
    question: "Combien de communes de Gironde ont au moins une vente en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Verified by an independent raw-table query: 529."
    sql: |
      SELECT count(DISTINCT code_commune) AS nb_communes
      FROM dvf.ventes
      WHERE annee = 2024 AND est_vente;

  - id: sim-09
    category: simple
    difficulty: easy
    expected_behavior: answer
    question: "Quelle est la date de la vente la plus récente dans la base ?"
    paraphrase_of: null
    order_matters: false
    notes: "Useful later for relative-date questions. Last date of this release: 2025-12-31."
    sql: |
      SELECT max(date_mutation) AS derniere_vente
      FROM dvf.ventes
      WHERE est_vente;

  - id: sim-10
    category: simple
    difficulty: easy
    expected_behavior: answer
    question: "Combien de ventes par adjudication ont eu lieu en Gironde depuis 2022 ?"
    paraphrase_of: null
    order_matters: false
    notes: "'Depuis 2022' includes 2022 (2022-2025)."
    sql: |
      SELECT count(*) AS nb_adjudications
      FROM dvf.ventes
      WHERE nature_mutation = 'Adjudication' AND annee >= 2022;

  - id: sim-11
    category: simple
    difficulty: easy
    expected_behavior: answer
    question: "Combien de locaux industriels et commerciaux ont été vendus à Bordeaux en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "type_local = 'Local industriel. commercial ou assimilé'; counts properties (dvf.biens)."
    sql: |
      SELECT count(*) AS nb_locaux
      FROM dvf.biens
      WHERE code_commune = '33063' AND annee = 2024 AND est_vente
        AND type_local = 'Local industriel. commercial ou assimilé';

  - id: sim-12
    category: simple
    difficulty: easy
    expected_behavior: answer
    question: "Combien de ventes concernent le code postal 33000 en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Postal code is taken at mutation level (main property). 1 094 Bordeaux mutations (2021-2025) have no code_postal at all. Verified by an independent raw-table query (any row in 33000): 2 270."
    sql: |
      SELECT count(*) AS nb_ventes
      FROM dvf.ventes
      WHERE code_postal = '33000' AND annee = 2024 AND est_vente;

  - id: agg-01
    category: aggregation
    difficulty: easy
    expected_behavior: answer
    question: "Quel est le prix médian d'un appartement à Bordeaux en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Single-apartment sales only (vente_reference), otherwise multi-lot prices pollute the median. Verified by an independent raw-table query (Etalab dedupe method): 205 000."
    sql: |
      SELECT round(percentile_cont(0.5) WITHIN GROUP (ORDER BY valeur_fonciere)) AS prix_median
      FROM dvf.ventes
      WHERE code_commune = '33063' AND annee = 2024
        AND vente_reference AND type_bien = 'Appartement';

  - id: agg-02
    category: aggregation
    difficulty: medium
    expected_behavior: answer
    question: "Quel est le prix médian au m² des appartements à Bordeaux en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Reference question for the paraphrase group. prix_m2 on single-property sales. Public cross-check: Etalab's own method (stats_dvf, which the DVF app shows) gives 4 219 EUR/m2 on the raw table for 2024 (it also keeps Adjudication and collapses identical lots); the same method reproduces Etalab's published Bordeaux monthly medians exactly for 23/24 months of 2024-2025."
    sql: |
      SELECT round(percentile_cont(0.5) WITHIN GROUP (ORDER BY prix_m2)) AS prix_m2_median
      FROM dvf.ventes
      WHERE code_commune = '33063' AND annee = 2024 AND type_bien = 'Appartement'
        AND prix_m2 IS NOT NULL;

  - id: agg-03
    category: aggregation
    difficulty: medium
    expected_behavior: answer
    question: "Quel est le prix moyen au m² des maisons à Pessac en 2023 ?"
    paraphrase_of: null
    order_matters: false
    notes: "v1.7: a 'prix moyen' is the median (convention), robust to exceptional sales; v1.6 used AVG (4 434). The answer may give the mean next to it."
    sql: |
      SELECT round(percentile_cont(0.5) WITHIN GROUP (ORDER BY prix_m2)) AS prix_m2_median
      FROM dvf.ventes
      WHERE code_commune = '33318'  -- Pessac
        AND annee = 2023 AND type_bien = 'Maison' AND prix_m2 IS NOT NULL;

  - id: agg-04
    category: aggregation
    difficulty: easy
    expected_behavior: answer
    question: "Quelle est la surface médiane des appartements vendus à Talence en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Convention: descriptive property statistics (surface, pièces) use dvf.biens (every apartment sold), price statistics use vente_reference."
    sql: |
      -- Descriptive property statistics use dvf.biens (every apartment sold).
      SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY surface_reelle_bati) AS surface_mediane_m2
      FROM dvf.biens
      WHERE code_commune = '33522'  -- Talence
        AND annee = 2024 AND est_vente AND type_local = 'Appartement'
        AND surface_reelle_bati > 0;

  - id: agg-05
    category: aggregation
    difficulty: medium
    expected_behavior: answer
    question: "Quel est le prix médian au m² des maisons à Arcachon en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: ""
    sql: |
      SELECT round(percentile_cont(0.5) WITHIN GROUP (ORDER BY prix_m2)) AS prix_m2_median
      FROM dvf.ventes
      WHERE code_commune = '33009'  -- Arcachon
        AND annee = 2024 AND type_bien = 'Maison' AND prix_m2 IS NOT NULL;

  - id: agg-06
    category: aggregation
    difficulty: medium
    expected_behavior: answer
    question: "Quel est le prix médian d'un T2 à Bordeaux en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Domain vocabulary: T2 = APPARTEMENT with 2 pièces principales (convention)."
    sql: |
      SELECT round(percentile_cont(0.5) WITHIN GROUP (ORDER BY valeur_fonciere)) AS prix_median,
             count(*) AS nb_ventes
      FROM dvf.ventes
      WHERE code_commune = '33063' AND annee = 2024
        AND vente_reference AND type_bien = 'Appartement' AND nombre_pieces = 2;

  - id: agg-07
    category: aggregation
    difficulty: medium
    expected_behavior: answer
    question: "Quel est le prix médian au m² d'un T3 à Mérignac en 2025 ?"
    paraphrase_of: null
    order_matters: false
    notes: "T3 = apartment with 3 pièces principales. 2025 is complete in this release."
    sql: |
      SELECT round(percentile_cont(0.5) WITHIN GROUP (ORDER BY prix_m2)) AS prix_m2_median,
             count(*) AS nb_ventes
      FROM dvf.ventes
      WHERE code_commune = '33281' AND annee = 2025
        AND type_bien = 'Appartement' AND nombre_pieces = 3 AND prix_m2 IS NOT NULL;

  - id: agg-08
    category: aggregation
    difficulty: hard
    expected_behavior: answer
    question: "Quel est le montant total des ventes immobilières en Gironde en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "TRAP: valeur_fonciere repeats on every row of a mutation. Sum once per id_mutation. Verified by an independent raw-table query: 8 842 073 869.72 EUR; the naive SUM over rows gives 73.5 bn (x8.3)."
    sql: |
      SELECT sum(valeur_fonciere) AS montant_total
      FROM dvf.ventes
      WHERE annee = 2024 AND est_vente;

  - id: agg-09
    category: ambiguous
    difficulty: medium
    expected_behavior: clarify
    question: "Quel est le prix médian des terrains à bâtir à Saint-Médard-en-Jalles depuis 2021 ?"
    paraphrase_of: null
    notes: "Same 'terrain à bâtir' ambiguity as sim-05. Saint-Médard-en-Jalles 2021-2025: 4 sales by nature_mutation (median 282 500 EUR) vs 99 land-only sales with an AB parcel (median 182 150 EUR). Expected: ask, or state the definition used."
    sql: null

  - id: agg-10
    category: aggregation
    difficulty: medium
    expected_behavior: answer
    question: "Quelle est la surface de terrain médiane des maisons vendues à Lacanau en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "surface_terrain repeats on every local of a parcel; dvf.ventes sums it once per (parcel, culture). Single-house sales."
    sql: |
      SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY surface_terrain) AS surface_terrain_mediane_m2
      FROM dvf.ventes
      WHERE code_commune = '33214'  -- Lacanau
        AND annee = 2024 AND vente_reference AND type_bien = 'Maison'
        AND surface_terrain > 0;

  - id: agg-11
    category: unanswerable
    difficulty: medium
    expected_behavior: unanswerable
    question: "Compare le prix médian au m² des appartements neufs (VEFA) et anciens à Bordeaux en 2024."
    paraphrase_of: null
    notes: "VEFA TRAP: only 18 of 604 VEFA sales in Bordeaux 2024 have a type and a surface (the rest are untyped lots), so a VEFA EUR/m2 is not meaningful. Expected: explain the limit; may give the ancien figure (Vente: 4 211 EUR/m2, 2 849 sales)."
    sql: null

  - id: agg-12
    category: aggregation
    difficulty: easy
    expected_behavior: answer
    question: "Combien de pièces ont en moyenne les maisons vendues au Bouscat en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "nom_commune is 'Le Bouscat': article handling. Rows with 0 pièces are excluded."
    sql: |
      SELECT round(avg(nombre_pieces_principales), 1) AS nb_pieces_moyen
      FROM dvf.biens
      WHERE code_commune = '33069'  -- Le Bouscat
        AND annee = 2024 AND est_vente AND type_local = 'Maison'
        AND nombre_pieces_principales > 0;

  - id: agg-13
    category: aggregation
    difficulty: medium
    expected_behavior: answer
    question: "Quel est le prix médian au m² des appartements dans le code postal 33300 en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Postal code at mutation level."
    sql: |
      SELECT round(percentile_cont(0.5) WITHIN GROUP (ORDER BY prix_m2)) AS prix_m2_median
      FROM dvf.ventes
      WHERE code_postal = '33300' AND annee = 2024 AND type_bien = 'Appartement'
        AND prix_m2 IS NOT NULL;

  - id: agg-14
    category: ambiguous
    difficulty: medium
    expected_behavior: clarify
    question: "Quelle part des ventes d'appartements à Bordeaux en 2024 sont des VEFA ?"
    paraphrase_of: null
    notes: "VEFA TRAP: ~95% of VEFA sales have no type_local (lots of a building not yet in the cadastre), so 'appartements VEFA' cannot be identified. Typed apartments only: 0.6%; counting untyped VEFA lots as apartments: 16.0%. Expected: state the assumption."
    sql: null

  - id: agg-15
    category: aggregation
    difficulty: medium
    expected_behavior: answer
    question: "Quel est le prix de l'appartement le plus cher vendu à Bordeaux en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Single-apartment sales only, or the result will be a multi-lot building sale."
    sql: |
      SELECT max(valeur_fonciere) AS prix_max
      FROM dvf.ventes
      WHERE code_commune = '33063' AND annee = 2024
        AND vente_reference AND type_bien = 'Appartement';

  - id: agg-16
    category: aggregation
    difficulty: hard
    expected_behavior: answer
    question: "Quel est le prix au m² le plus bas observé pour un appartement à Bordeaux en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Decision: NO outlier filter, the question asks for the lowest OBSERVED value. Result 0.01 EUR/m2 comes from two sales recorded at 1 EUR (symbolic price); the next values (8, 12, 53 EUR/m2) are not market prices either. The answer must flag it as a data artefact, not a price. EXCEPTION to the 'EUR/m2 to the euro' rule: rounding would turn it into 0 and hide what it is."
    sql: |
      -- No outlier filter: the question asks for the lowest OBSERVED value.
      SELECT min(prix_m2) AS prix_m2_min
      FROM dvf.ventes
      WHERE code_commune = '33063' AND annee = 2024 AND type_bien = 'Appartement'
        AND prix_m2 IS NOT NULL;

  - id: agg-17
    category: aggregation
    difficulty: hard
    expected_behavior: answer
    question: "Quels sont le premier et le troisième quartile du prix au m² des maisons à Mérignac en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "percentile_cont(0.25 / 0.75). Verified by an independent raw-table query (Etalab dedupe): 3 500 / 4 808."
    sql: |
      SELECT round(percentile_cont(0.25) WITHIN GROUP (ORDER BY prix_m2)) AS q1,
             round(percentile_cont(0.75) WITHIN GROUP (ORDER BY prix_m2)) AS q3
      FROM dvf.ventes
      WHERE code_commune = '33281' AND annee = 2024 AND type_bien = 'Maison'
        AND prix_m2 IS NOT NULL;

  - id: agg-18
    category: aggregation
    difficulty: medium
    expected_behavior: answer
    question: "Quel est le prix médian au m² des appartements de plus de 100 m² à Bordeaux en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "'Plus de' = strictly greater than (surface_reelle_bati > 100)."
    sql: |
      SELECT round(percentile_cont(0.5) WITHIN GROUP (ORDER BY prix_m2)) AS prix_m2_median
      FROM dvf.ventes
      WHERE code_commune = '33063' AND annee = 2024 AND type_bien = 'Appartement'
        AND surface_reelle_bati > 100 AND prix_m2 IS NOT NULL;

  - id: agg-19
    category: aggregation
    difficulty: medium
    expected_behavior: answer
    question: "Quel est le prix médian des maisons avec un terrain de plus de 1 000 m² en Gironde en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Single-house sales; surface_terrain > 1000 (strict), summed once per parcel."
    sql: |
      SELECT round(percentile_cont(0.5) WITHIN GROUP (ORDER BY valeur_fonciere)) AS prix_median
      FROM dvf.ventes
      WHERE annee = 2024 AND vente_reference AND type_bien = 'Maison'
        AND surface_terrain > 1000;

  - id: agg-20
    category: aggregation
    difficulty: medium
    expected_behavior: answer
    question: "Donne le prix médian au m² des appartements à Bordeaux, Mérignac et Pessac en 2024."
    paraphrase_of: null
    order_matters: false
    notes: "GROUP BY commune, 3 rows."
    sql: |
      SELECT nom_commune,
             round(percentile_cont(0.5) WITHIN GROUP (ORDER BY prix_m2)) AS prix_m2_median
      FROM dvf.ventes
      WHERE code_commune IN ('33063', '33281', '33318') AND annee = 2024
        AND type_bien = 'Appartement' AND prix_m2 IS NOT NULL
      GROUP BY nom_commune;

  - id: tmp-01
    category: temporal
    difficulty: medium
    expected_behavior: answer
    question: "Comment a évolué le prix médian au m² des appartements à Bordeaux entre 2021 et 2025 ?"
