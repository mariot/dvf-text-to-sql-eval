  - id: mul-02
    category: multi_step
    difficulty: hard
    expected_behavior: answer
    question: "Pour chaque commune avec au moins 100 ventes d'appartements en 2024, quel est l'écart entre son prix médian au m² et celui de Bordeaux ?"
    paraphrase_of: null
    order_matters: false
    notes: "Bordeaux itself is excluded (gap 0). Communes with >= 100 single-apartment sales in 2024."
    sql: |
      WITH m AS (
          SELECT code_commune, nom_commune, count(*) AS n,
                 percentile_cont(0.5) WITHIN GROUP (ORDER BY prix_m2) AS med
          FROM dvf.ventes
          WHERE annee = 2024 AND type_bien = 'Appartement' AND prix_m2 IS NOT NULL
          GROUP BY 1, 2
      )
      SELECT m.nom_commune, m.n AS nb_ventes, round(m.med) AS prix_m2_median,
             round(m.med - b.med) AS ecart_bordeaux,
             round((100 * (m.med / b.med - 1))::numeric, 1) AS ecart_pct
      FROM m, (SELECT med FROM m WHERE code_commune = '33063') b
      WHERE m.n >= 100 AND m.code_commune <> '33063';

  - id: mul-03
    category: multi_step
    difficulty: hard
    expected_behavior: answer
    question: "Quelles communes ont vu leur nombre de ventes baisser chaque année depuis 2022 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Strictly decreasing over consecutive complete years 2022 > 2023 > 2024 > 2025. Many results are tiny communes; the answer should say so."
    sql: |
      WITH c AS (
          SELECT code_commune, nom_commune,
                 count(*) FILTER (WHERE annee = 2022) AS n22,
                 count(*) FILTER (WHERE annee = 2023) AS n23,
                 count(*) FILTER (WHERE annee = 2024) AS n24,
                 count(*) FILTER (WHERE annee = 2025) AS n25
          FROM dvf.ventes
          WHERE est_vente
          GROUP BY 1, 2
      )
      SELECT nom_commune, n22, n23, n24, n25
      FROM c
      WHERE n22 > n23 AND n23 > n24 AND n24 > n25;

