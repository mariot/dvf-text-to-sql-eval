  - id: dq-01
    category: data_quality
    difficulty: hard
    expected_behavior: answer
    question: "Quelle est la valeur moyenne d'une vente à Bordeaux en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "TRAP: average per mutation, not per row. Multi-commune portfolio TRAP: a 68.6 M EUR sale spanning Bordeaux and Lacanau is attributed to Lacanau (main property); attributing it to every commune it touches gives 406 771 instead of 394 201."
