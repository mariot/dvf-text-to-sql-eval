  - id: mul-05
    category: multi_step
    difficulty: hard
    expected_behavior: answer
    question: "Quelle est la répartition des appartements vendus à Bordeaux en 2024 par nombre de pièces (1, 2, 3, 4, 5 et plus), avec le prix médian au m² de chaque catégorie ?"
    paraphrase_of: null
    order_matters: true
    notes: "CASE bucketing for 5+. Convention: when counts and prices are combined, both come from the same sample (vente_reference). 0-pièce rows excluded."
    sql: |
      SELECT CASE WHEN nombre_pieces >= 5 THEN '5+' ELSE nombre_pieces::text END AS pieces,
             count(*) AS nb_ventes,
             round(percentile_cont(0.5) WITHIN GROUP (ORDER BY prix_m2)) AS prix_m2_median
      FROM dvf.ventes
      WHERE code_commune = '33063' AND annee = 2024 AND type_bien = 'Appartement'
        AND prix_m2 IS NOT NULL AND nombre_pieces >= 1
      GROUP BY 1
      ORDER BY 1;

  - id: mul-06
    category: multi_step
    difficulty: hard
    expected_behavior: answer
    question: "Combien de biens ont été revendus au moins deux fois en Gironde depuis 2021 ?"
    paraphrase_of: null
    order_matters: false
    notes: "TRAP: without lot1_numero in the key, flats of one building with the same surface and room count collide: 6 567 of 7 514 apartment 'resales' had two different lot numbers (v1.0 answered 10 795). AMBIGUITY: 'revendus au moins deux fois' = sold >= 2 times or resold twice (>= 3 sales); both are returned, the answer must state its reading. Heuristic, imperfect by nature (a lot renumbered between two sales is missed)."
    sql: |
      -- Heuristic: a property = (id_parcelle, type, surface bâtie, pièces, lot1_numero) on
      -- single-property sales. Without lot1_numero, different flats of one building with the
      -- same surface collide (87% of apartment "resales" were two different lots).
      -- Both readings of "revendus au moins deux fois" are returned.
      SELECT count(*) FILTER (WHERE nb_dates >= 2) AS nb_biens_vendus_2_fois_ou_plus,
             count(*) FILTER (WHERE nb_dates >= 3) AS nb_biens_vendus_3_fois_ou_plus
      FROM (
          SELECT b.id_parcelle, b.code_type_local, b.surface_reelle_bati, b.nombre_pieces_principales,
                 coalesce(b.lot1_numero, '') AS lot, count(DISTINCT v.date_mutation) AS nb_dates
          FROM dvf.biens b
          JOIN dvf.ventes v USING (id_mutation)
          WHERE v.est_vente AND v.bien_unique AND b.code_type_local IN (1, 2)
            AND b.surface_reelle_bati > 0
          GROUP BY 1, 2, 3, 4, 5
      ) t;

  - id: mul-07
    category: multi_step
    difficulty: hard
    expected_behavior: answer
    question: "Pour les maisons revendues à Bordeaux depuis 2021, quelle est la plus-value médiane entre deux ventes ?"
    paraphrase_of: null
    order_matters: false
    notes: "Same heuristic as mul-06 (lot number in the key); consecutive sales only, single-house sales in Bordeaux. Median holding ~2 years; extremes (-0.7 M / +1.35 M EUR) exist, the median is robust."
    sql: |
      WITH s AS (
          SELECT b.id_parcelle, b.surface_reelle_bati, b.nombre_pieces_principales,
                 coalesce(b.lot1_numero, '') AS lot, v.date_mutation, v.valeur_fonciere
          FROM dvf.biens b
          JOIN dvf.ventes v USING (id_mutation)
          WHERE v.code_commune = '33063' AND v.vente_reference AND v.type_bien = 'Maison'
            AND b.code_type_local = 1 AND b.surface_reelle_bati > 0
      ),
      paires AS (
          SELECT valeur_fonciere - lag(valeur_fonciere) OVER w AS plus_value,
                 date_mutation - lag(date_mutation) OVER w AS jours
          FROM s
          WINDOW w AS (PARTITION BY id_parcelle, surface_reelle_bati, nombre_pieces_principales, lot
                       ORDER BY date_mutation)
      )
      SELECT count(*) AS nb_reventes,
             round(percentile_cont(0.5) WITHIN GROUP (ORDER BY plus_value)) AS plus_value_mediane,
             round(percentile_cont(0.5) WITHIN GROUP (ORDER BY jours)) AS duree_detention_mediane_jours
      FROM paires
      WHERE plus_value IS NOT NULL AND jours > 0;

  - id: mul-08
    category: multi_step
    difficulty: medium
    expected_behavior: answer
    question: "Quelles communes ont un prix médian au m² des appartements supérieur à celui de l'ensemble de la Gironde en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Subquery for the department median; >= 20 sales per commune."
    sql: |
      WITH g AS (
          SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY prix_m2) AS med
          FROM dvf.ventes
          WHERE annee = 2024 AND type_bien = 'Appartement' AND prix_m2 IS NOT NULL
      )
      SELECT v.nom_commune,
             round(percentile_cont(0.5) WITHIN GROUP (ORDER BY v.prix_m2)) AS prix_m2_median,
             count(*) AS nb_ventes
      FROM dvf.ventes v
      WHERE v.annee = 2024 AND v.type_bien = 'Appartement' AND v.prix_m2 IS NOT NULL
      GROUP BY v.code_commune, v.nom_commune
      HAVING count(*) >= 20
         AND percentile_cont(0.5) WITHIN GROUP (ORDER BY v.prix_m2) > (SELECT med FROM g);

  - id: mul-09
    category: multi_step
    difficulty: medium
    expected_behavior: answer
    question: "Quel est le rang de Lormont parmi les communes de Gironde par prix médian au m² des appartements en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "RANK() by median DESC (1 = most expensive) among communes with >= 20 sales: Lormont 41st of 44."
    sql: |
      WITH m AS (
          SELECT code_commune, nom_commune,
                 percentile_cont(0.5) WITHIN GROUP (ORDER BY prix_m2) AS med
          FROM dvf.ventes
          WHERE annee = 2024 AND type_bien = 'Appartement' AND prix_m2 IS NOT NULL
          GROUP BY 1, 2
          HAVING count(*) >= 20
      )
      SELECT rang, nb_communes, round(med) AS prix_m2_median
      FROM (SELECT code_commune, med, rank() OVER (ORDER BY med DESC) AS rang,
                   count(*) OVER () AS nb_communes
            FROM m) r
      WHERE code_commune = '33249';

  - id: mul-10
    category: multi_step
    difficulty: hard
    expected_behavior: answer
    question: "Quelle est la proportion de maisons et d'appartements dans les ventes de chaque commune de Bordeaux Métropole en 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Bordeaux Métropole = 28 communes, dvf.zones reference table. VEFA TRAP: untyped VEFA lots ('Lot non décrit') are neither houses nor apartments, so the apartment share is understated in communes with lots of new builds."
    sql: |
      SELECT v.nom_commune,
             count(*) AS nb_ventes,
             round(100.0 * count(*) FILTER (WHERE v.type_bien = 'Maison') / count(*), 1) AS part_maisons_pct,
             round(100.0 * count(*) FILTER (WHERE v.type_bien = 'Appartement') / count(*), 1) AS part_appartements_pct
      FROM dvf.ventes v
      JOIN dvf.zones z ON z.code_commune = v.code_commune AND z.zone = 'Bordeaux Métropole'
      WHERE v.annee = 2024 AND v.est_vente
      GROUP BY v.code_commune, v.nom_commune;

  - id: mul-11
    category: multi_step
    difficulty: hard
    expected_behavior: answer
    question: "Quel est le taux de croissance annuel moyen du prix médian au m² des appartements à Bordeaux entre 2021 et 2025 ?"
    paraphrase_of: null
    order_matters: false
    notes: "CAGR: (p2025/p2021)^(1/4) - 1, in %, one decimal (v1.1 had two decimals, against the convention)."
    sql: |
      WITH m AS (
          SELECT annee, percentile_cont(0.5) WITHIN GROUP (ORDER BY prix_m2) AS med
          FROM dvf.ventes
          WHERE code_commune = '33063' AND annee IN (2021, 2025)
            AND type_bien = 'Appartement' AND prix_m2 IS NOT NULL
          GROUP BY annee
      )
      SELECT round((100 * (power(max(med) FILTER (WHERE annee = 2025)
                               / max(med) FILTER (WHERE annee = 2021), 1.0 / 4) - 1))::numeric, 1)
                 AS taux_croissance_annuel_moyen_pct
      FROM m;

  - id: mul-12
    category: multi_step
    difficulty: hard
    expected_behavior: answer
    question: "Combien de ventes d'appartements à Bordeaux en 2024 se situent au-dessus du prix médian au m² de leur code postal ?"
    paraphrase_of: null
    order_matters: false
    notes: "Median per postal code; strictly above."
    sql: |
      SELECT count(*) AS nb_ventes
      FROM dvf.ventes v
      JOIN (SELECT code_postal, percentile_cont(0.5) WITHIN GROUP (ORDER BY prix_m2) AS med_cp
            FROM dvf.ventes
            WHERE code_commune = '33063' AND annee = 2024 AND type_bien = 'Appartement'
              AND prix_m2 IS NOT NULL
            GROUP BY code_postal) m USING (code_postal)
      WHERE v.code_commune = '33063' AND v.annee = 2024 AND v.type_bien = 'Appartement'
        AND v.prix_m2 > m.med_cp;

  - id: mul-13
    category: multi_step
    difficulty: hard
    expected_behavior: answer
    question: "Quelles ventes de maisons en Gironde en 2024 ont un prix au m² plus de trois fois supérieur à la médiane de leur commune ?"
    paraphrase_of: null
    order_matters: false
    notes: "Outlier detection; commune median from the same year's single-house sales, with no minimum sample (the question sets none), so medians of tiny communes are noisy. prix_m2 rounded to the euro (v1.1 had cents)."
    sql: |
      WITH m AS (
          SELECT code_commune, percentile_cont(0.5) WITHIN GROUP (ORDER BY prix_m2) AS med
          FROM dvf.ventes
          WHERE annee = 2024 AND type_bien = 'Maison' AND prix_m2 IS NOT NULL
          GROUP BY code_commune
      )
      SELECT v.id_mutation, v.nom_commune, v.valeur_fonciere, v.surface_reelle_bati,
             round(v.prix_m2) AS prix_m2, round(m.med) AS prix_m2_median_commune
      FROM dvf.ventes v
      JOIN m USING (code_commune)
      WHERE v.annee = 2024 AND v.type_bien = 'Maison' AND v.prix_m2 > 3 * m.med;

  - id: mul-14
    category: multi_step
    difficulty: hard
    expected_behavior: answer
    question: "Pour chaque année, quelle commune avait le prix médian au m² des maisons le plus élevé, avec au moins 30 ventes ?"
    paraphrase_of: null
    order_matters: true
    notes: "Top-1 per group (DISTINCT ON)."
    sql: |
      SELECT DISTINCT ON (annee) annee, nom_commune, prix_m2_median, nb_ventes
      FROM (
          SELECT annee, code_commune, nom_commune, count(*) AS nb_ventes,
