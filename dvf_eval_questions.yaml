  - id: tmp-08
    category: temporal
    difficulty: hard
    expected_behavior: answer
    question: "Quelle commune de Gironde, avec au moins 50 ventes de maisons chaque année, a connu la plus forte hausse du prix médian au m² des maisons entre 2021 et 2024 ?"
    paraphrase_of: null
    order_matters: false
    notes: "Threshold applies to every year (2021-2024), on the sales used for the median. Hausse = relative change. FRAGILE: runner-up Soulac-sur-Mer is at +27.1% vs Lacanau +27.4%; a small convention change can swap them."
    sql: |
      WITH par_an AS (
          SELECT code_commune, nom_commune, annee, count(*) AS n,
                 percentile_cont(0.5) WITHIN GROUP (ORDER BY prix_m2) AS med
          FROM dvf.ventes
          WHERE annee BETWEEN 2021 AND 2024 AND type_bien = 'Maison' AND prix_m2 IS NOT NULL
          GROUP BY 1, 2, 3
      ),
      eligibles AS (
          SELECT code_commune FROM par_an
          GROUP BY code_commune
          HAVING count(*) = 4 AND min(n) >= 50
      )
      SELECT a.nom_commune,
             round(a.med) AS med_2021, round(b.med) AS med_2024,
             round((100 * (b.med / a.med - 1))::numeric, 1) AS hausse_pct
      FROM par_an a
      JOIN par_an b ON b.code_commune = a.code_commune AND b.annee = 2024
      WHERE a.annee = 2021 AND a.code_commune IN (SELECT code_commune FROM eligibles)
      ORDER BY hausse_pct DESC
      LIMIT 1;

