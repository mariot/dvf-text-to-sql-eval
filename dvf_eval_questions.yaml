      FROM dvf.ventes v, dvf.lieux l
      WHERE l.nom = 'Place de la Bourse'
        AND v.annee = 2024 AND v.type_bien = 'Appartement' AND v.prix_m2 IS NOT NULL
        AND ST_DWithin(v.geom, l.geom, 5000)
        AND ST_Distance(v.geom, l.geom) < 5000
      GROUP BY 1
      ORDER BY 1;

  - id: spa-07
    category: spatial
    difficulty: easy
    expected_behavior: answer
    question: "Combien de ventes n'ont pas de coordonnées géographiques en 2024 ?"
    paraphrase_of: null
