  - id: fam-01
    category: multi_step
    difficulty: hard
    expected_behavior: answer
    question: "Nous avons deux enfants à l'école primaire et cherchons une maison à acheter dans Bordeaux Métropole. Dans quelles communes la plupart des adresses ont une école élémentaire à moins de 10 minutes à pied, et quel y est le prix médian d'une maison ?"
    paraphrase_of: null
    order_matters: true
    notes: "WHY: a family wants the kids to walk to school and needs a price level per commune to shortlist. Conventions: 'la plupart' = more than 50 % of the commune's addresses with min_elementaire < 10; house price = median valeur_fonciere of single-house sales in 2025 (latest complete year), >= 20 sales."
    sql: |
      WITH ecole AS (
          SELECT code_commune,
                 round(100.0 * count(*) FILTER (WHERE min_elementaire < 10) / count(*), 1) AS part_adresses_pct
          FROM dvf.acces_adresses GROUP BY code_commune
      ), prix AS (
          SELECT code_commune, count(*) AS nb_ventes,
                 round(percentile_cont(0.5) WITHIN GROUP (ORDER BY valeur_fonciere)) AS prix_median_maison
          FROM dvf.ventes WHERE annee = 2025 AND vente_reference AND type_bien = 'Maison'
          GROUP BY code_commune HAVING count(*) >= 20
      )
      SELECT c.nom_commune, e.part_adresses_pct, p.prix_median_maison, p.nb_ventes
      FROM ecole e
      JOIN prix p USING (code_commune)
      JOIN dvf.zones z ON z.code_commune = e.code_commune AND z.zone = 'Bordeaux Métropole'
      JOIN dvf.communes c ON c.code_commune = e.code_commune
      WHERE e.part_adresses_pct > 50
      ORDER BY p.prix_median_maison;

